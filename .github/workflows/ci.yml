name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run build

      - run: bun run test

  smoke:
    name: smoke (${{ matrix.label }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: node 20
            runtime: node
            node-version: "20"
            bun-version: 1.3.14
          - label: node current
            runtime: node
            node-version: current
            bun-version: 1.3.14
          - label: bun 1.2
            runtime: bun
            bun-version: 1.2.0
          - label: bun current
            runtime: bun
            bun-version: latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - uses: actions/setup-node@v7
        if: matrix.runtime == 'node'
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile

      - run: ${{ matrix.runtime }} scripts/smoke.mjs

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run test:integration
